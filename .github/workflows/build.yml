# Builds the debug APK (system flavor) on every push and pull request.
# Uses no secrets: debug builds are signed with a throwaway debug key made on the runner.
name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle downloads and checks that gradle-wrapper.jar is genuine.
      - uses: gradle/actions/setup-gradle@v4

      - name: Test catalog and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testSystemDebugUnitTest :app:assembleSystemDebug

      - uses: actions/upload-artifact@v4
        with:
          name: npu-image-studio-debug-apk
          path: app/build/outputs/apk/system/debug/*.apk
          if-no-files-found: error
